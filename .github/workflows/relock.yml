name: Relock

# One-off helper: regenerates package-lock.json on ubuntu-latest so that
# Linux-only optional transitive dependencies (sharp / satteri native and wasm
# builds) are recorded. A lockfile generated on Windows omits them, which makes
# `npm ci` fail on the runner. Delete this workflow once the lockfile is fixed.

on:
  workflow_dispatch:

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Regenerate lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --include=optional
          node -e "const l=require('./package-lock.json');const k=Object.keys(l.packages);console.log('packages:',k.length);console.log('emnapi top-level:',k.filter(x=>/^node_modules\/@emnapi/.test(x)));"

      - name: Verify npm ci works against it
        run: npm ci

      - name: Verify the site builds
        run: npm run build

      - uses: actions/upload-artifact@v5
        with:
          name: package-lock
          path: package-lock.json
